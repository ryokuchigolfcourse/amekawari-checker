name: 雨割り自動判定

on:
  schedule:
    # 毎日 正午(JST) = 03:00 (UTC) に実行
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにする

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 判定スクリプト実行
        run: python amekawari_checker.py

      - name: 結果を保存（確認用）
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
