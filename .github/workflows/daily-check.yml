name: 雨割り自動判定

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ライブラリインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 対象日を計算
        id: target_date
        run: |
          TARGET_DATE=$(date -u -d "+1 day" +%F)
          echo "value=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "[INFO] 対象日（翌日）: ${TARGET_DATE}"

      - name: 状態確認（二重実行防止）
        id: check_state
        run: |
          if [ -f state.json ]; then
            SAVED_DATE=$(python3 -c "import json;print(json.load(open('state.json')).get('date',''))" 2>/dev/null || echo "")
            HANDLED=$(python3 -c "import json;print(json.load(open('state.json')).get('handled',False))" 2>/dev/null || echo "False")
          else
            SAVED_DATE=""
            HANDLED="False"
          fi
          echo "[INFO] state.json の記録日: ${SAVED_DATE} / handled: ${HANDLED}"
          if [ "${SAVED_DATE}" = "${{ steps.target_date.outputs.value }}" ] && [ "${HANDLED}" = "True" ]; then
            echo "[INFO] 本日分は既に処理済みのため、スキップします（もう一方のトリガーが先に成功済み）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 判定スクリプト実行
        if: steps.check_state.outputs.skip != 'true'
        run: python amekawari_checker.py

      - name: 結果を保存（確認用）
        if: steps.check_state.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json

      - name: メール通知（雨割り適用時のみ／判定エラー時は要確認アラート）
        if: steps.check_state.outputs.skip != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_notify.py

      - name: 状態を更新（二重実行防止用）
        if: steps.check_state.outputs.skip != 'true'
        run: |
          python3 - <<'EOF'
          import json
          try:
              with open("result.json", encoding="utf-8") as f:
                  result = json.load(f)
          except FileNotFoundError:
              result = {}
          state = {
              "date": "${{ steps.target_date.outputs.value }}",
              "handled": True,
              "applicable": result.get("applicable"),
          }
          with open("state.json", "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state.json (${{ steps.target_date.outputs.value }})"
          git push
